<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e1c">
<title>Gravity Shift — 중력 반전 러너</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main id="stage">
  <canvas id="game" aria-label="게임 화면"></canvas>

  <!-- 시작 화면 -->
  <section id="screen-title" class="screen">
    <div class="card">
      <h1>GRAVITY&nbsp;SHIFT</h1>
      <p class="tag">탭할 때마다 중력이 뒤집혀요</p>
      <p class="hint">바닥과 천장을 오가며 장애물을 피하세요.<br>
        📱 화면 탭&ensp;·&ensp;⌨️ 스페이스 / Shift</p>
      <button class="btn" id="btn-start" type="button">게임 시작</button>
      <p class="hint" id="title-best">최고 기록 0점</p>
    </div>
  </section>

  <!-- 게임 오버 화면 -->
  <section id="screen-over" class="screen hidden">
    <div class="card">
      <h2>게임 오버</h2>
      <p class="score-big" id="over-score">이번 점수 0점</p>
      <p class="badge hidden" id="over-new">🎉 새 최고 기록!</p>
      <p class="hint" id="over-best">최고 기록 0점</p>
      <button class="btn" id="btn-restart" type="button">다시 하기</button>
    </div>
  </section>

  <!-- 일시정지 화면 -->
  <section id="screen-pause" class="screen hidden">
    <div class="card">
      <h2>일시정지</h2>
      <p class="hint">화면을 탭하면 계속돼요</p>
      <button class="btn" id="btn-resume" type="button">계속하기</button>
    </div>
  </section>
</main>
<script src="js/game.js"></script>
</body>
</html>
